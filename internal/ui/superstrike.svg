<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 760">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2f3d"/>
      <stop offset="0.55" stop-color="#1b1d27"/>
      <stop offset="1" stop-color="#101119"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5bc0ff"/>
      <stop offset="1" stop-color="#2f8fff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#5bc0ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5bc0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="240" cy="320" rx="230" ry="340" fill="url(#glow)"/>

  <!-- mouse body: narrow front (top), flared rear (bottom) -->
  <path d="M240 36
           C150 36 122 118 117 224
           C112 330 94 446 120 580
           C141 678 200 712 240 712
           C280 712 339 678 360 580
           C386 446 368 330 363 224
           C358 118 330 36 240 36 Z"
        fill="url(#body)" stroke="url(#edge)" stroke-width="3.5"/>

  <!-- left/right click split -->
  <path d="M240 40 L240 312" stroke="url(#edge)" stroke-width="2.6" stroke-opacity="0.75"/>

  <!-- scroll wheel -->
  <rect x="226" y="150" width="28" height="78" rx="14" fill="url(#edge)" fill-opacity="0.9"/>
  <rect x="231" y="161" width="18" height="56" rx="9" fill="#0a0b11"/>

  <!-- subtle side contours -->
  <path d="M122 372 C113 452 122 532 144 596" stroke="#5bc0ff" stroke-width="2" stroke-opacity="0.35" fill="none"/>
  <path d="M358 372 C367 452 358 532 336 596" stroke="#5bc0ff" stroke-width="2" stroke-opacity="0.35" fill="none"/>

  <!-- haptic pulse rings near the buttons -->
  <circle cx="240" cy="250" r="120" fill="none" stroke="#5bc0ff" stroke-width="1.4" stroke-opacity="0.18"/>
  <circle cx="240" cy="250" r="160" fill="none" stroke="#2f8fff" stroke-width="1.2" stroke-opacity="0.12"/>
</svg>
