<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b6fff"/>
      <stop offset="1" stop-color="#5bc0ff"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#bg)"/>
  <rect x="0" y="0" width="256" height="256" rx="58" fill="url(#sheen)"/>

  <!-- mouse body -->
  <path d="M128 38
           C95 38 83 74 81 108
           C79 152 72 186 91 209
           C104 225 120 228 128 228
           C136 228 152 225 165 209
           C184 186 177 152 175 108
           C173 74 161 38 128 38 Z"
        fill="#ffffff" opacity="0.97"/>

  <!-- click split -->
  <path d="M128 42 L128 120" stroke="#1b6fff" stroke-width="5" stroke-opacity="0.45"/>
  <!-- scroll wheel -->
  <rect x="120" y="72" width="16" height="42" rx="8" fill="#1b6fff"/>
  <!-- haptic pulse hint -->
  <circle cx="128" cy="93" r="58" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.25"/>
</svg>
